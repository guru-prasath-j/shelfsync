name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # The runner's default JDK (25) is newer than the Android Gradle
      # toolchain understands; build with an LTS JDK it supports.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the app is developed on. Newer stable
          # (3.47+) deprecates package:flutter/material.dart in favour of
          # package:material_ui, which this SDK doesn't have yet; bump both
          # together when migrating.
          flutter-version: 3.41.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Goldens are rendered on macOS locally; font rendering differs on Linux,
      # so CI runs logic tests only. Goldens run in the pre-push check instead.
      - run: flutter test --exclude-tags golden
      - name: Build debug APK
        if: hashFiles('app/android/app/build.gradle*') != ''
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        if: hashFiles('app/build/app/outputs/flutter-apk/app-debug.apk') != ''
        with:
          name: shelfsync-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  cms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
